{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h1 class="card-title h3 mb-3">Bienvenido</h1>
                <p class="text-muted small">Entre con su correo y contraseña
                    (los valida la API: el front no guarda usuarios).</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label" for="usuario">Correo</label>
                        <input class="form-control" id="usuario" name="usuario"
                               type="email" required placeholder="demo@correo.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="contrasena">Contraseña</label>
                        <input class="form-control" id="contrasena" name="contrasena"
                               type="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
