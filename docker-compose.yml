# ==============================================================
# Proyecto Diseño de Software — versión 1:
# api_facturas (C#/ASP.NET Core) + PostgreSQL
#
#   Navegador → API FACTURAS (C#, :8054) → PostgreSQL (bdfacturas)
#
# Uso: docker compose up -d --build     (UN solo comando)
# Reset de la BD: docker compose down -v && docker compose up -d
#
# Este archivo CRECE por versiones: más adelante llegarán otros
# motores y el front Flask (Jinja2).
# ==============================================================
services:

  # --- PostgreSQL 16 (liviano: la imagen pesa ~50 MB) ---
  postgres:
    restart: unless-stopped   # si el PC se reinicia, este servicio revive con Docker
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "Diseno123!"    # clave del superusuario 'postgres'
      POSTGRES_DB: bdfacturas_postgres_local   # la BD que crea al nacer
    volumes:
      - pgdata:/var/lib/postgresql/data        # los datos sobreviven a `down`
      # PostgreSQL SÍ ejecuta automáticamente los scripts montados aquí
      # la PRIMERA vez (con el volumen vacío) — por eso este proyecto no
      # necesita contenedor inicializador:
      - ./db/bdfacturas_postgres.sql:/docker-entrypoint-initdb.d/bdfacturas_postgres.sql:ro
    ports:
      - "15454:5432"     # puerto en su PC (para SQLTools/pgAdmin opcional)
    healthcheck:
      # ¿La BD ya RESPONDE consultas? (no solo "el contenedor existe")
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdfacturas_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- API Facturas v1 — C# / ASP.NET Core ---
  api-facturas:
    build: ./api_facturas
    volumes:
      - ./api_facturas:/app      # el código montado: guardar un .cs recompila solo
      - /app/bin                 # bin y obj quedan DENTRO del contenedor (Linux),
      - /app/obj                 #   sin mezclarse con los compilados de Windows
    restart: unless-stopped
    ports:
      - "8054:8054"              # http://localhost:8054
    environment:
      # La cadena usa el NOMBRE del servicio como host (postgres:5432),
      # no localhost: dentro de la red interna de compose los servicios
      # se resuelven por nombre. Esta variable SOBREESCRIBE el valor de
      # appsettings.json (ASP.NET lee "ConnectionStrings__X" así).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=bdfacturas_postgres_local;Username=postgres;Password=Diseno123!"
      # ------------------------------------------------------------
      # EL TOKEN (v3)
      # ------------------------------------------------------------
      # La clave que FIRMA el token. Program.cs la exige de 32 caracteres o
      # mas y ABORTA el arranque si falta — y esa validacion es la que hizo
      # falta aqui: sin esta variable la API compilaba, arrancaba y se moria,
      # y el puerto simplemente no respondia.
      #
      # Que no este en appsettings.json es a proposito: una clave de firma no
      # se versiona. Esta es de DESARROLLO y lo dice su propio texto; en un
      # servidor real se inyecta por variable de entorno o por un gestor de
      # secretos, y nunca se parece a esta.
      Jwt__Key: "ClaveDeDesarrolloDelCursoDisenoDeSoftware_2026_2_NoEsUnSecreto!"
      Jwt__Issuer: "ApiFacturas"
      Jwt__Audience: "FrontFacturas"
      # 60 minutos. Vencido, el token devuelve 401 — y para que eso ocurra de
      # verdad, Program.cs pone ClockSkew en cero: ASP.NET perdona 5 minutos
      # por defecto, asi que sin esa linea un token vencido sigue sirviendo.
      Jwt__DuracionMinutos: "60"
    depends_on:
      postgres:
        condition: service_healthy
        # ↑ la API arranca cuando la BD ya RESPONDE (y como el script se
        #   auto-ejecutó al nacer, ya existe con sus 12 tablas y datos).

  # ------------------------------------------------------------
  # LA INTERFAZ GRAFICA (Flask + Jinja2)
  #
  # Contenedor aparte: la interfaz y la API son dos procesos distintos que se
  # hablan por HTTP. Apague la API y la interfaz sigue en pie, con su aviso.
  # ------------------------------------------------------------
  front-flask:
    build: ./front_flask
    container_name: facturas-front-diseno-v3
    ports:
      - "8069:8069"
    volumes:
      # El codigo montado: Flask en modo depuracion recarga al guardar.
      - ./front_flask:/app
    environment:
      PUERTO: "8069"
      # El NOMBRE del servicio, no localhost: dentro del contenedor del front,
      # localhost seria el front mismo.
      API_FACTURAS_URL: "http://api-facturas:8054"
      # La clave que FIRMA la cookie de sesion. En claro a proposito: es de
      # desarrollo y este repositorio es material de curso. Lo que importa es
      # que el codigo la lea de la configuracion y no la lleve escrita adentro.
      CLAVE_SESION: "ClaveDeDesarrolloDelCursoDisenoDeSoftware_2026_2"
    depends_on:
      # NO depende de la base: el front no tiene nada que hacer con ella.
      - api-facturas

volumes:
  pgdata:      # declaración del volumen nombrado (la "memoria" de la BD)
