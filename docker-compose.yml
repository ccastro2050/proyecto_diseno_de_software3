# ==============================================================
# Proyecto Diseño de Software — versión 1:
# api_facturas (C#/ASP.NET Core) + PostgreSQL
#
#   Navegador → API FACTURAS (C#, :8054) → PostgreSQL (bdfacturas)
#
# Uso: docker compose up -d --build     (UN solo comando)
# Reset de la BD: docker compose down -v && docker compose up -d
#
# Este archivo CRECE por versiones: más adelante llegarán otros
# motores y el front Flask (Jinja2).
# ==============================================================
services:

  # --- PostgreSQL 16 (liviano: la imagen pesa ~50 MB) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "Diseno123!"    # clave del superusuario 'postgres'
      POSTGRES_DB: bdfacturas_postgres_local   # la BD que crea al nacer
    volumes:
      - pgdata:/var/lib/postgresql/data        # los datos sobreviven a `down`
      # PostgreSQL SÍ ejecuta automáticamente los scripts montados aquí
      # la PRIMERA vez (con el volumen vacío) — por eso este proyecto no
      # necesita contenedor inicializador:
      - ./db/bdfacturas_postgres.sql:/docker-entrypoint-initdb.d/bdfacturas_postgres.sql:ro
    ports:
      - "15454:5432"     # puerto en su PC (para SQLTools/pgAdmin opcional)
    healthcheck:
      # ¿La BD ya RESPONDE consultas? (no solo "el contenedor existe")
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdfacturas_postgres_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- API Facturas v1 — C# / ASP.NET Core ---
  api-facturas:
    build: ./api_facturas
    volumes:
      - ./api_facturas:/app      # el código montado: guardar un .cs recompila solo
      - /app/bin                 # bin y obj quedan DENTRO del contenedor (Linux),
      - /app/obj                 #   sin mezclarse con los compilados de Windows
    restart: unless-stopped
    ports:
      - "8054:8054"              # http://localhost:8054
    environment:
      # La cadena usa el NOMBRE del servicio como host (postgres:5432),
      # no localhost: dentro de la red interna de compose los servicios
      # se resuelven por nombre. Esta variable SOBREESCRIBE el valor de
      # appsettings.json (ASP.NET lee "ConnectionStrings__X" así).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=bdfacturas_postgres_local;Username=postgres;Password=Diseno123!"
    depends_on:
      postgres:
        condition: service_healthy
        # ↑ la API arranca cuando la BD ya RESPONDE (y como el script se
        #   auto-ejecutó al nacer, ya existe con sus 12 tablas y datos).

volumes:
  pgdata:      # declaración del volumen nombrado (la "memoria" de la BD)
